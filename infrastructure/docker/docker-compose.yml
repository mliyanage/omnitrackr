version: '3.8'

services:
  # PostgreSQL for Development
  postgres-dev:
    image: postgres:15-alpine
    container_name: omnitrackr-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DEV_DB}
      POSTGRES_USER: ${POSTGRES_DEV_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DEV_PASSWORD}
    ports:
      - "${POSTGRES_DEV_PORT}:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_DEV_USER} -d ${POSTGRES_DEV_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omnitrackr-network

  # PostgreSQL for Testing (separate container on different port)
  postgres-test:
    image: postgres:15-alpine
    container_name: omnitrackr-postgres-test
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB}
      POSTGRES_USER: ${POSTGRES_TEST_USER}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD}
    ports:
      - "${POSTGRES_TEST_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_TEST_USER} -d ${POSTGRES_TEST_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Use tmpfs for test database (faster, no persistence needed)
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - omnitrackr-network

  # PgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: omnitrackr-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres-dev
      - postgres-test
    networks:
      - omnitrackr-network
    profiles:
      - tools  # Only start with: docker compose --profile tools up

volumes:
  postgres-dev-data:
    name: omnitrackr-postgres-dev-data
  pgadmin-data:
    name: omnitrackr-pgadmin-data

networks:
  omnitrackr-network:
    name: omnitrackr-network
    driver: bridge
